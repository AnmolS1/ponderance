<svg viewBox="0 0 420 430" xmlns="http://www.w3.org/2000/svg" role="img" width="100%" style="max-width:420px;height:auto">
<circle cx="210" cy="200" r="160" fill="#EEF0EC" stroke="#1B2A33" stroke-width="2.5"/>
<path d="M 210 40 A 48 160 0 0 1 210 360" fill="none" stroke="#2E5E8C" stroke-width="1.6"/>
<path d="M 210 40 A 48 160 0 0 0 210 360" fill="none" stroke="#2E5E8C" stroke-width="1.4" stroke-dasharray="5 5"/>
<path d="M 50 200 A 160 48 0 0 1 370 200" fill="none" stroke="#2E5E8C" stroke-width="1.4" stroke-dasharray="5 5"/>
<path d="M 50 200 A 160 48 0 0 0 370 200" fill="none" stroke="#E84A27" stroke-width="3.4"/>
<circle cx="210" cy="200" r="5" fill="#E84A27"/>
<circle cx="50" cy="200" r="5" fill="#1B2A33"/>
<circle cx="370" cy="200" r="5" fill="#1B2A33"/>
<text x="210" y="272" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" font-weight="400" fill="#E84A27" text-anchor="middle">great-circle arc = geodesic</text>
<text x="268" y="54" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11" font-weight="400" fill="#2E5E8C" text-anchor="start">another</text>
<text x="268" y="68" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11" font-weight="400" fill="#2E5E8C" text-anchor="start">great circle</text>
<text x="210" y="398" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" font-weight="400" fill="#1B2A33" text-anchor="middle">every geodesic on a sphere is a great circle</text>
<text x="210" y="416" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" font-weight="400" fill="#2E5E8C" text-anchor="middle">— its plane passes through the center</text>
</svg>
