<svg width="720" height="460" viewBox="0 0 720 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&amp;display=swap');
      text { font-family: 'Courier New', 'Lucida Console', monospace; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="720" height="460" fill="#f2efe8"/>

  <!-- Title -->
  <text x="40" y="52" font-size="11" font-weight="700" letter-spacing="5" fill="#1a2b4a" opacity="0.5">PONDERA — COLOR PALETTE</text>
  <line x1="40" y1="62" x2="680" y2="62" stroke="#1a2b4a" stroke-width="0.6" opacity="0.2"/>

  <!-- ── ROW 1: Core darks ── -->
  <text x="40" y="95" font-size="8.5" letter-spacing="3" fill="#1a2b4a" opacity="0.4">CORE DARKS</text>

  <!-- Deep black -->
  <rect x="40" y="106" width="90" height="90" rx="6" fill="#060a12"/>
  <text x="85" y="212" font-size="8.5" text-anchor="middle" fill="#1a2b4a" opacity="0.65">#060A12</text>
  <text x="85" y="224" font-size="7.5" text-anchor="middle" fill="#1a2b4a" opacity="0.4">Deep Black</text>

  <!-- Background navy -->
  <rect x="148" y="106" width="90" height="90" rx="6" fill="#0d1525"/>
  <text x="193" y="212" font-size="8.5" text-anchor="middle" fill="#1a2b4a" opacity="0.65">#0D1525</text>
  <text x="193" y="224" font-size="7.5" text-anchor="middle" fill="#1a2b4a" opacity="0.4">Abyss Navy</text>

  <!-- Mid navy -->
  <rect x="256" y="106" width="90" height="90" rx="6" fill="#1b2a4a"/>
  <text x="301" y="212" font-size="8.5" text-anchor="middle" fill="#1a2b4a" opacity="0.65">#1B2A4A</text>
  <text x="301" y="224" font-size="7.5" text-anchor="middle" fill="#1a2b4a" opacity="0.4">Deep Navy</text>

  <!-- Ink -->
  <rect x="364" y="106" width="90" height="90" rx="6" fill="#1a2b4a"/>
  <text x="409" y="212" font-size="8.5" text-anchor="middle" fill="#1a2b4a" opacity="0.65">#1A2B4A</text>
  <text x="409" y="224" font-size="7.5" text-anchor="middle" fill="#1a2b4a" opacity="0.4">Ink Navy</text>

  <!-- ── ROW 2: Accents ── -->
  <text x="40" y="257" font-size="8.5" letter-spacing="3" fill="#1a2b4a" opacity="0.4">ACCENTS</text>

  <!-- Teal primary -->
  <rect x="40" y="268" width="90" height="90" rx="6" fill="#3de8c0"/>
  <text x="85" y="374" font-size="8.5" text-anchor="middle" fill="#1a2b4a" opacity="0.65">#3DE8C0</text>
  <text x="85" y="386" font-size="7.5" text-anchor="middle" fill="#1a2b4a" opacity="0.4">Synapse Teal</text>

  <!-- Teal muted -->
  <rect x="148" y="268" width="90" height="90" rx="6" fill="#1ab89a"/>
  <text x="193" y="374" font-size="8.5" text-anchor="middle" fill="#1a2b4a" opacity="0.65">#1AB89A</text>
  <text x="193" y="386" font-size="7.5" text-anchor="middle" fill="#1a2b4a" opacity="0.4">Deep Teal</text>

  <!-- Amber -->
  <rect x="256" y="268" width="90" height="90" rx="6" fill="#f5c842"/>
  <text x="301" y="374" font-size="8.5" text-anchor="middle" fill="#1a2b4a" opacity="0.65">#F5C842</text>
  <text x="301" y="386" font-size="7.5" text-anchor="middle" fill="#1a2b4a" opacity="0.4">Amber</text>

  <!-- ── ROW: Lights ── -->
  <text x="472" y="257" font-size="8.5" letter-spacing="3" fill="#1a2b4a" opacity="0.4">LIGHTS</text>

  <!-- Letter / steel blue -->
  <rect x="472" y="106" width="90" height="90" rx="6" fill="#d8e2f0"/>
  <text x="517" y="212" font-size="8.5" text-anchor="middle" fill="#1a2b4a" opacity="0.65">#D8E2F0</text>
  <text x="517" y="224" font-size="7.5" text-anchor="middle" fill="#1a2b4a" opacity="0.4">Steel Blue</text>

  <!-- Near white -->
  <rect x="580" y="106" width="90" height="90" rx="6" fill="#edf1f7" stroke="#d8e2f0" stroke-width="0.8"/>
  <text x="625" y="212" font-size="8.5" text-anchor="middle" fill="#1a2b4a" opacity="0.65">#EDF1F7</text>
  <text x="625" y="224" font-size="7.5" text-anchor="middle" fill="#1a2b4a" opacity="0.4">Ghost White</text>

  <!-- Off-white bg -->
  <rect x="472" y="268" width="90" height="90" rx="6" fill="#f2efe8" stroke="#d8e2f0" stroke-width="0.8"/>
  <text x="517" y="374" font-size="8.5" text-anchor="middle" fill="#1a2b4a" opacity="0.65">#F2EFE8</text>
  <text x="517" y="386" font-size="7.5" text-anchor="middle" fill="#1a2b4a" opacity="0.4">Warm Off-White</text>

  <!-- Mid node white -->
  <rect x="580" y="268" width="90" height="90" rx="6" fill="#e8edf5" stroke="#d8e2f0" stroke-width="0.8"/>
  <text x="625" y="374" font-size="8.5" text-anchor="middle" fill="#1a2b4a" opacity="0.65">#E8EDF5</text>
  <text x="625" y="386" font-size="7.5" text-anchor="middle" fill="#1a2b4a" opacity="0.4">Cool White</text>

  <!-- Footer -->
  <line x1="40" y1="422" x2="680" y2="422" stroke="#1a2b4a" stroke-width="0.6" opacity="0.2"/>
  <text x="40" y="442" font-size="8" letter-spacing="2" fill="#1a2b4a" opacity="0.35">PONDERA BRAND SYSTEM · TEMP PALETTE v1</text>
  <text x="680" y="442" font-size="8" letter-spacing="1" text-anchor="end" fill="#1a2b4a" opacity="0.35">9 COLORS</text>
</svg>
